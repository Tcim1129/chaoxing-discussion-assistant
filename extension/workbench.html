<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂讨论分析</title><link rel="stylesheet" href="workbench.css"></head>
<body>
<a class="skip-link" href="#main">跳到分析内容</a>
<div class="app">
  <aside class="sidebar"><a class="brand" href="workbench.html"><span class="brand-icon"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 20v-6 M12 20V8 M19 20V3 M3 21h18"/></svg></span><span>课堂讨论分析<small>超星讨论助手</small></span></a>
    <nav aria-label="分析导航">
      <button data-view="classroom" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3h14v18H5z M8 7h8 M8 11h8 M8 15h5"/></svg><span>课堂纪要</span></button>
      <button data-view="overview" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></svg><span>讨论总览</span></button>
      <button data-view="activity" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 20v-6 M12 20V8 M19 20V3 M3 21h18"/></svg><span>参与情况</span></button>
      <button data-view="classes" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h18v16H3z M3 10h18 M9 5v16 M15 5v16"/></svg><span>班级统计</span></button>
      <button data-view="breadth" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v6 M12 15v6 M3 12h6 M15 12h6 M9 9h6v6H9z"/></svg><span>讨论广度</span></button>
      <button data-view="depth" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 7 9-4 9 4-9 4z M3 12l9 4 9-4 M3 17l9 4 9-4"/></svg><span>讨论深度</span></button>
      <button data-view="grading" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3h14v18H5z m8 7 2 2 4-4 M8 13h8 M8 17h5"/></svg><span>讨论评分</span></button>
      <button data-view="words" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6"/></svg><span>关键词</span></button>
      <button data-view="learning" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18 M6 16l5-5 4 2 6-8 M16 5h5v5"/></svg><span>学习进展</span></button>
      <button data-view="report" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3h10l4 4v14H5z M15 3v5h4 M8 12h8 M8 16h8"/></svg><span>教学报告</span></button>
      <button data-view="data" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h18v14H3z M3 10h18 M8 10v9"/></svg><span>数据与统计说明</span></button>
    </nav>
    <div class="sidebar-bottom"><button id="settings-button" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6"/></svg><span>模型设置</span></button><span class="small muted">逐条统计 · 原文可查</span></div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="page-header"><div><div class="eyebrow" id="dataset-kind">当前讨论</div><h1 id="topic-title">课堂讨论分析</h1></div><div class="header-actions"><label class="small"><input type="checkbox" id="hide-names"> 匿名显示</label><button id="recollect">重新采集</button><button id="classroom-analyze-all" class="primary">一键课堂分析</button><details id="analysis-tools" class="analysis-tools"><summary>发言内容分析</summary><div class="actions"><button id="start-analysis">本地快速识别</button><button id="model-analysis">AI 内容与论证分析</button><p class="small muted">分析当前筛选范围内的发言，不生成课堂纪要或学生总分。</p></div></details><button id="pause-analysis" hidden>暂停分析</button></div></header>
    <div id="scope-bar" class="scope-bar"><label>班级<select id="class-filter"><option value="">全部班级</option></select></label><details><summary>更多筛选</summary><label>话题<select id="topic-filter"><option value="">全部话题</option></select></label><label>开始时间<input id="from-filter" type="datetime-local"></label><label>结束时间<input id="to-filter" type="datetime-local"></label></details><button id="reset-filters" class="text-button">清除筛选</button><button id="pause-collection" hidden>暂停收集</button><span class="scope-count" id="scope-count"></span></div>
    <div id="status" class="status-strip" role="status" aria-live="polite">请从讨论页采集，或导入已有记录。</div>
    <section id="task-progress" class="task-progress" hidden aria-label="分析任务进度"><div class="progress-top"><strong id="task-phase">检查数据</strong><span id="task-count"></span></div><progress id="analysis-progress" value="0" max="100"></progress><div class="steps"><span>检查采集</span><span>分析发言</span><span>核对原文</span><span>补查遗漏</span><span>生成报告</span></div><details><summary>查看处理记录</summary><ol id="task-trace"></ol></details></section>
    <div id="content"></div>
  </main>
</div>
<dialog id="evidence-dialog" class="evidence-dialog" aria-labelledby="evidence-title"><header><div><div class="eyebrow">原文与判断依据</div><h2 id="evidence-title">查看发言</h2><p id="evidence-subtitle" class="small muted" hidden></p></div><button id="close-evidence" aria-label="关闭原文">关闭</button></header><div id="evidence-content"></div><footer id="source-navigation" class="source-navigation" hidden><button id="source-previous">上一条</button><span id="source-position" class="small muted" aria-live="polite"></span><button id="source-next">下一条</button></footer></dialog>
<dialog id="send-dialog" aria-labelledby="send-title"><h2 id="send-title">检查待发送内容</h2><p>将使用已设置的模型接口，发送匿名发言和相关的上下文。请检查正文中是否仍有个人信息。</p><textarea id="send-preview" readonly rows="12" aria-label="待发送的匿名文本"></textarea><div class="dialog-actions"><button id="cancel-send">返回</button><button id="confirm-send" class="primary">开始分析</button></div></dialog>
<dialog id="score-help-dialog" class="score-help-dialog" aria-labelledby="score-help-title"><header><h2 id="score-help-title">评分说明</h2><button id="score-help-close" aria-label="关闭评分说明">关闭</button></header><div id="score-help-content"></div></dialog>
<div id="action-feedback" class="action-feedback" role="status" aria-live="polite" hidden><span id="action-feedback-text"></span><button id="dismiss-feedback" aria-label="关闭操作提示">关闭</button></div>
<input id="dataset-file" type="file" accept=".json,.txt,application/json,text/plain" hidden>
<input id="snapshot-file" type="file" accept=".json,application/json" hidden>
<input id="labels-file" type="file" accept="application/json" hidden>
<script src="analysis/engine.js"></script><script src="analysis/agent.js"></script><script src="analysis/provider.js"></script><script src="analysis/classroom.js"></script><script src="analysis/workflow.js"></script><script src="analysis/grading.js"></script><script src="workbench-grading.js"></script><script src="workbench-classroom.js"></script><script src="workbench.js"></script>
</body></html>
